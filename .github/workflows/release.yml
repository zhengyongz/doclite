# 三平台自动构建与发版：推 v* tag 触发（workflow_dispatch 仅供调试，不打 tag 不上传）
# 关键约定：
#   - 只缓存 ~/.npm（setup-node cache:'npm'），绝不缓存 node_modules——postinstall 的
#     patch-package 必须每次执行，否则 foliate-js 补丁不生效
#   - electron-builder 一律 --publish never，Release 统一由 softprops/action-gh-release 上传
#     （package.json 里 build.publish 的 github provider 仅为 latest.yml 元数据生成所需）
#   - fail-fast: false —— 单平台失败不影响其余平台产出
name: Build and Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    # 不在 job 级注入 GH_TOKEN：npm ci/postinstall 与 electron-builder 全程持有可写 token 属提权面，
    # 仅在最后的“上传资产”步骤注入（workbuddy M3）
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # 只缓存 npm 缓存目录，node_modules 不缓存（npm ci 每次全量装）

      # ---------- electron / electron-builder 二进制缓存 ----------
      # 发版每次要下 Electron 二进制（~100MB/平台/架构）+ winCodeSign + nsis 工具链，
      # 不缓存则每次发版都重下（数分钟）。只缓存下载缓存，不缓存 node_modules。
      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-builder-${{ runner.os }}-${{ matrix.platform }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-builder-${{ runner.os }}-${{ matrix.platform }}-
            electron-builder-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build app & converters bundle
        run: npm run build

      # ---------- macOS：先用 sips+iconutil 生成 icns（构建产物，不入库）再打包 ----------
      - name: Generate icns (macOS only)
        if: matrix.platform == 'mac'
        run: |
          mkdir -p AppIcon.iconset
          sips -z 16 16   build/icon.png --out AppIcon.iconset/icon_16x16.png
          sips -z 32 32   build/icon.png --out AppIcon.iconset/icon_16x16@2x.png
          sips -z 32 32   build/icon.png --out AppIcon.iconset/icon_32x32.png
          sips -z 64 64   build/icon.png --out AppIcon.iconset/icon_32x32@2x.png
          sips -z 128 128 build/icon.png --out AppIcon.iconset/icon_128x128.png
          sips -z 256 256 build/icon.png --out AppIcon.iconset/icon_128x128@2x.png
          sips -z 256 256 build/icon.png --out AppIcon.iconset/icon_256x256.png
          sips -z 512 512 build/icon.png --out AppIcon.iconset/icon_256x256@2x.png
          sips -z 512 512 build/icon.png --out AppIcon.iconset/icon_512x512.png
          cp build/icon.png AppIcon.iconset/icon_512x512@2x.png
          iconutil -c icns AppIcon.iconset -o build/icon.icns

      - name: Package (macOS)
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac dmg zip --x64 --arm64 --publish never

      - name: Package (Windows)
        if: matrix.platform == 'win'
        run: npx electron-builder --win nsis --publish never

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux deb --publish never

      # 转换组件 zip + sha256（仅 Linux job 生成）
      # 三平台都跑会各自产出同名 zip，zip 字节可能不同 → 发布资产的 zip 与 .sha256
      # 可能来自不同 job，导致用户安装组件时 sha256 校验必失败（workbuddy H1）
      - name: Pack converters component
        if: matrix.platform == 'linux'
        run: node build/pack-converters.cjs

      # 清理 electron-builder 调试文件与 Linux 无关元数据（AppImage 用，本项目 deb 走自研升级）
      # 注意：必须用 Node 而非 rm——Windows runner 默认 shell 是 PowerShell，rm -f 会失败
      - name: Clean up non-release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e "const fs=require('fs');for(const f of ['release/builder-debug.yml','release/latest-linux.yml']){try{fs.rmSync(f);console.log('removed',f)}catch{}}"

      # ---------- 上传资产（仅 tag 推送时；workflow_dispatch 调试跳过） ----------
      # overwrite_files：重跑（tag 复位重推）时覆盖同名旧资产
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          overwrite_files: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.exe.blockmap
            release/*.zip.blockmap
            release/*.deb
            release/*.yml
            release/*.sha256
